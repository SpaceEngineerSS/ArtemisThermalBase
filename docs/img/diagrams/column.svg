<line class="s-ink2" x1="210.0" y1="406.0" x2="210.0" y2="383.0"/><polyline class="s-ink2" points="212.1,387.5 210.0,383.0 207.9,387.5"/>
<text class="ink2 small" x="218.0" y="402.0" text-anchor="start">geothermal 18 mW/m²</text>
<text class="acc small" x="420.0" y="84.0" text-anchor="start">SURFACE NODE</text>
<text class="ink2 sans small" x="420.0" y="100.0" text-anchor="start">Half-cell, backward Euler. εσT⁴ is linearised</text>
<text class="ink2 sans small" x="420.0" y="116.0" text-anchor="start">and iterated (Newton) until the whole column changes</text>
<text class="ink2 sans small" x="420.0" y="132.0" text-anchor="start">by less than 0.0001 K.</text>
<text class="acc small" x="420.0" y="158.0" text-anchor="start">INTERIOR</text>
<text class="ink2 sans small" x="420.0" y="174.0" text-anchor="start">Crank–Nicolson on a geometric grid: first cell</text>
<text class="ink2 sans small" x="420.0" y="190.0" text-anchor="start">0.5 mm, growth ×1.07, 101 nodes.</text>
<text class="acc small" x="420.0" y="216.0" text-anchor="start">PROPERTIES</text>
<text class="ink2 sans small" x="420.0" y="232.0" text-anchor="start">ρ(z) rises from 1100 to 1800 kg/m³ (H = 6 cm);</text>
<text class="ink2 sans small" x="420.0" y="248.0" text-anchor="start">k(T) = k_c + k_r T³; cp(T) polynomial (Hayne 2017).</text>
<text class="acc small" x="420.0" y="274.0" text-anchor="start">BOTTOM</text>
<text class="ink2 sans small" x="420.0" y="290.0" text-anchor="start">Constant geothermal flux into the last half-cell.</text>
<text class="acc small" x="420.0" y="316.0" text-anchor="start">PER FACET</text>
<text class="ink2 sans small" x="420.0" y="332.0" text-anchor="start">Every facet has its own column; all columns</text>
<text class="ink2 sans small" x="420.0" y="348.0" text-anchor="start">advance together in one Numba parallel call.</text>
</svg>
