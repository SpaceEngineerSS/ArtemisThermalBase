<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Reference frames at the south pole">
<title>Reference frames at the south pole</title>
<style>text{font-family:'IBM Plex Mono','Plex Mono',ui-monospace,Consolas,monospace;font-size:12px}.sans{font-family:'IBM Plex Sans','Plex Sans',system-ui,sans-serif}.small{font-size:10.5px}.big{font-size:14px}line,path,polyline,circle,rect,ellipse{fill:none;stroke-width:1;vector-effect:non-scaling-stroke}.bg{fill:#F4F2EC}.ink{fill:#1D1F21}.ink2{fill:#55585B}.ink3{fill:#8C8E8F}.acc{fill:#B44A0E}.s-ink{stroke:#1D1F21}.s-ink2{stroke:#55585B}.s-rule{stroke:#A9A397}.s-faint{stroke:#D8D3C8}.s-acc{stroke:#E8641B}.s-cold{stroke:#2F6690}.f-sheet{fill:#FBFAF6}.f-acc{fill:#E8641B}.f-cold{fill:#2F6690}.f-soft{fill:#93B5CC}.f-rule{fill:#D8D3C8}@media (prefers-color-scheme:dark){.bg{fill:#17191B}.ink{fill:#E8E5DD}.ink2{fill:#A7A9AA}.ink3{fill:#73777A}.acc{fill:#F59A63}.s-ink{stroke:#E8E5DD}.s-ink2{stroke:#A7A9AA}.s-rule{stroke:#4A4F54}.s-faint{stroke:#2F3337}.s-acc{stroke:#F07A35}.s-cold{stroke:#6FA3C8}.f-sheet{fill:#1F2225}.f-acc{fill:#F07A35}.f-cold{fill:#6FA3C8}.f-soft{fill:#3E5F77}.f-rule{fill:#2F3337}}</style>
<rect class="bg" x="0" y="0" width="760" height="380" style="stroke:none"/>
<text class="acc small" x="20.0" y="24.0" text-anchor="start">LOOKING DOWN ON THE SOUTH POLE</text>
<circle class="s-faint" cx="210" cy="195" r="150.0"/>
<circle class="s-faint" cx="210" cy="195" r="99.0"/>
<circle class="s-faint" cx="210" cy="195" r="49.5"/>
<line class="s-faint" x1="210" y1="195" x2="210.0" y2="45.0"/>
<text class="ink3 small" x="210.0" y="33.0" text-anchor="middle">0°</text>
<line class="s-faint" x1="210" y1="195" x2="285.0" y2="65.1"/>
<line class="s-faint" x1="210" y1="195" x2="339.9" y2="120.0"/>
<line class="s-faint" x1="210" y1="195" x2="360.0" y2="195.0"/>
<text class="ink3 small" x="376.0" y="199.0" text-anchor="middle">90°E</text>
<line class="s-faint" x1="210" y1="195" x2="339.9" y2="270.0"/>
<line class="s-faint" x1="210" y1="195" x2="285.0" y2="324.9"/>
<line class="s-faint" x1="210" y1="195" x2="210.0" y2="345.0"/>
<text class="ink3 small" x="210.0" y="365.0" text-anchor="middle">180°</text>
<line class="s-faint" x1="210" y1="195" x2="135.0" y2="324.9"/>
<line class="s-faint" x1="210" y1="195" x2="80.1" y2="270.0"/>
<line class="s-faint" x1="210" y1="195" x2="60.0" y2="195.0"/>
<text class="ink3 small" x="44.0" y="199.0" text-anchor="middle">90°W</text>
<line class="s-faint" x1="210" y1="195" x2="80.1" y2="120.0"/>
<line class="s-faint" x1="210" y1="195" x2="135.0" y2="65.1"/>
<line class="s-ink" x1="210.0" y1="195.0" x2="288.0" y2="195.0"/><polyline class="s-ink" points="281.7,198.0 288.0,195.0 281.7,192.0"/>
<line class="s-ink" x1="210.0" y1="195.0" x2="210.0" y2="117.0"/><polyline class="s-ink" points="213.0,123.3 210.0,117.0 207.0,123.3"/>
<text class="ink small" x="292.0" y="199.0" text-anchor="start">grid x</text>
<text class="ink small" x="214.0" y="111.0" text-anchor="start">grid y</text>
<circle class="s-ink f-acc" cx="210" cy="195" r="2.5" style="stroke:none"/>
<text class="ink3 small" x="202.0" y="211.0" text-anchor="end">pole</text>
<circle class="f-acc" cx="253.8" cy="231.5" r="3.5" style="stroke:none"/>
<text class="acc small" x="261.8" y="247.5" text-anchor="start">site 129.78°E</text>
<line class="s-acc" x1="253.8" y1="231.5" x2="220.5" y2="271.4"/><polyline class="s-acc" points="222.1,265.6 220.5,271.4 226.0,268.9"/>
<line class="s-acc" x1="253.8" y1="231.5" x2="293.8" y2="264.7"/><polyline class="s-acc" points="288.0,263.2 293.8,264.7 291.2,259.3"/>
<text class="acc small" x="215.4" y="281.6" text-anchor="middle">E</text>
<text class="acc small" x="299.9" y="273.9" text-anchor="middle">N</text>
<text class="acc small" x="430.0" y="74.0" text-anchor="start">SUN SOURCES</text>
<text class="ink2 sans small" x="430.0" y="90.0" text-anchor="start">SPICE, Skyfield and the synthetic model all return</text>
<text class="ink2 sans small" x="430.0" y="106.0" text-anchor="start">a unit vector s in the Moon's body frame (MOON_ME).</text>
<text class="acc small" x="430.0" y="132.0" text-anchor="start">MESH FRAME</text>
<text class="ink2 sans small" x="430.0" y="148.0" text-anchor="start">A projected DEM keeps its own grid axes. At the DEM</text>
<text class="ink2 sans small" x="430.0" y="164.0" text-anchor="start">centre we step the inverse projection along x and y,</text>
<text class="ink2 sans small" x="430.0" y="180.0" text-anchor="start">project out the local vertical and get R = [x̂; ŷ; û].</text>
<text class="acc small" x="430.0" y="206.0" text-anchor="start">ROTATION</text>
<text class="ink2 sans small" x="430.0" y="222.0" text-anchor="start">s_mesh = R · s_body, once per step, for every Sun</text>
<text class="ink2 sans small" x="430.0" y="238.0" text-anchor="start">source alike. det R = +1 is checked when R is built.</text>
<text class="acc small" x="430.0" y="264.0" text-anchor="start">SYNTHETIC</text>
<text class="ink2 sans small" x="430.0" y="280.0" text-anchor="start">Synthetic terrain uses local east/north/up at the</text>
<text class="ink2 sans small" x="430.0" y="296.0" text-anchor="start">configured target instead of grid axes.</text>
</svg>
