name: Idea or request
description: Physics, data sources, app features, documentation.
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and what would you use it for?
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Papers, datasets or tools that do this already.
