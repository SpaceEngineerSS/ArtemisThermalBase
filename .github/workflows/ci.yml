name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Keep modules separate so public check metadata identifies a failing
      # numerical subsystem even when raw Actions logs require authentication.
      - name: Test integration and research pipeline
        run: python -m pytest tests/test_integration_fixes.py tests/test_research_pipeline.py
      - name: Test coordinates and illumination
        run: python -m pytest tests/test_phase_d.py
      - name: Test ray-triangle intersections
        run: python -m pytest tests/test_raytracer.py::TestMollerTrumbore
      - name: Test ray-box intersections
        run: python -m pytest tests/test_raytracer.py::TestRayAABB
      - name: Test BVH construction
        run: python -m pytest tests/test_raytracer.py::TestBVHShadowMap::test_bvh_builds_without_error
      - name: Test overhead BVH illumination
        run: python -m pytest tests/test_raytracer.py::TestBVHShadowMap::test_flat_terrain_full_illumination
      - name: Test BVH shadow monotonicity
        run: python -m pytest tests/test_raytracer.py::TestBVHShadowMap::test_shadow_fraction_increases_with_lower_sun
      - name: Test BVH shadow boundary
        run: python -m pytest tests/test_raytracer.py::TestBVHShadowMap::test_shadow_boundary_moves_with_sun_angle
      - name: Test BVH crater-center shadow
        run: python -m pytest tests/test_raytracer.py::TestBVHShadowMap::test_center_shadowed_below_critical_angle
      - name: Test thermal solver
        run: python -m pytest tests/test_thermal_solver.py
      - name: Test physics v2
        run: python -m pytest tests/test_physics_v2.py
      - name: Test physics v3
        run: python -m pytest tests/test_physics_v3.py
      - run: python -m ruff check .
      - name: Type-check core engine
        run: python -m mypy -p core_engine
      - name: Type-check data ingestion
        run: python -m mypy -p data_ingestion
      - name: Type-check simulation
        run: python -m mypy -p simulation
      - name: Type-check thermal solver
        run: python -m mypy -p thermal_solver
      - name: Type-check validation
        run: python -m mypy -p validation
      - name: Type-check entry point
        run: python -m mypy -m main
