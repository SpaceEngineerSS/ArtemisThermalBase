name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      ARTEMIS_REDUCE_MOTION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[dev]"
      - name: NAIF kernels (cached)
        uses: actions/cache@v6
        with:
          path: data/ephemeris
          key: naif-${{ hashFiles('config/data_sources.yaml') }}
      - run: python tools/fetch_research_data.py --group ephemeris
      - run: python -m pytest --cov --cov-report=term-missing:skip-covered
      - run: python -m ruff check .
      - run: python -m mypy -p artemis_thermal

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Installed command works outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          artemis configs
          artemis run --duration 2 --dt 900 --cratersize 2000 --point-source --no-figures --output smoke
          test -f smoke/surface_T_final.npy
