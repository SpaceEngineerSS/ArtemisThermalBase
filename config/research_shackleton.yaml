# Shackleton research configuration.
#
# Fail-closed: needs a provenance-verified LOLA DEM (tools/prepare_lola_dem.py)
# and the NAIF DE440 kernels (tools/fetch_research_data.py --group ephemeris).
# Agreement with Diviner is tracked in docs/VALIDATION_STATUS.md and is not
# implied by running this file.
extends: default_config.yaml

solver:
  thermal:
    time:
      dt_s: 120.0
  illumination:
    solar_disk_samples: 64
    point_source_mode: false

view_factors:
  enabled: true
  num_rays: 512
  seed: 42

ephemeris:
  mode: "spice"
  kernel_files:
    - "data/ephemeris/naif0012.tls"
    - "data/ephemeris/de440s.bsp"
    - "data/ephemeris/moon_pa_de440_200625.bpc"
    - "data/ephemeris/moon_de440_250416.tf"
  frame: "MOON_ME"
  aberration_correction: "LT+S"

research:
  enabled: true
  require_real_dem: true
  require_dem_provenance: true
  minimum_spinup_cycles: 3

time_range:
  start: "2025-01-01T00:00:00Z"
  end: "2025-01-30T12:44:03Z"
  output_interval_s: 3600.0
  spinup_cycles: 3
  spinup_convergence_tolerance_K: 0.1

resources:
  max_memory_mb: 6144.0              # research grids need a workstation
