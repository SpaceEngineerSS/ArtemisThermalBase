# ArtemisThermalBase — default configuration
#
# This is the preview setup: synthetic Shackleton-sized bowl, analytical Sun,
# sizes that finish in a minute or two on a laptop. Every value here can be
# overridden by a second file that starts with `extends: default_config.yaml`
# (see research_shackleton.yaml). Units are in the key names or comments.

target:
  name: "Shackleton crater"
  latitude_deg: -89.67          # USGS Gazetteer of Planetary Nomenclature, feature 5450
  longitude_deg: 129.78

constants:
  stefan_boltzmann: 5.670374419e-8   # W m^-2 K^-4 (CODATA 2018)
  solar_constant: 1361.0             # W m^-2 at 1 AU (Kopp & Lean 2011)
  astronomical_unit: 1.495978707e11  # m (IAU 2012)
  speed_of_light: 2.99792458e8       # m s^-1

lunar:
  radius_m: 1737400.0
  sidereal_period_s: 2360591.5104    # 27.321661 d
  synodic_period_s: 2551442.9        # 29.530589 d, one lunar day
  obliquity_deg: 1.5424              # to the ecliptic (Rambaux & Williams 2011)
  solar_angular_diameter_deg: 0.533

surface:
  bond_albedo: 0.12                  # used when hapke.enabled is false
  thermal_emissivity: 0.95

# Hayne et al. (2017), JGR Planets 122, 2371-2400.
regolith:
  density:                           # rho(z) = deep - (deep - surface) exp(-z/H)
    surface_kg_m3: 1100.0
    deep_kg_m3: 1800.0
    transition_depth_m: 0.06         # H
  conductivity:                      # k(T) = k_contact + k_radiative T^3
    surface:
      k_contact: 7.4e-4
      k_radiative: 2.0e-11
    deep:
      k_contact: 3.4e-3
      k_radiative: 1.0e-11
    layer_boundary_m: 0.02
  specific_heat:                     # cp(T) = c0 + c1 T^0.5 + c2 T + c3 T^2 + c4 T^3
    c0: -3.6125
    c1: 2.7431
    c2: 2.3616e-3
    c3: -1.2340e-5
    c4: 8.9093e-9
    minimum_value: 8.0               # J kg^-1 K^-1, floor that keeps cp positive near 0 K
  geothermal_flux: 0.018             # W m^-2, Apollo 15/17 (Langseth et al. 1976)

solver:
  thermal:
    grid:
      dz_surface_m: 5.0e-4           # top layer thickness
      growth_ratio: 1.07             # geometric growth with depth
      num_layers: 100                # reaches ~6.2 m, below the annual wave
    time:
      dt_s: 300.0
      max_dt_s: 3600.0
    newton:
      max_iterations: 20
      tolerance_K: 1.0e-4
      relaxation: 1.0
    # equilibrium: start each column at the temperature that balances its
    # mean absorbed sunlight over one lunar day (a few ms of extra ray tracing).
    # uniform: start everything at initial_temperature_K.
    initial_condition: "equilibrium"
    initial_temperature_K: 200.0
  raytracer:
    bvh:
      max_leaf_triangles: 4
      sah_num_bins: 16
    epsilon: 1.0e-10
  illumination:
    solar_disk_samples: 16           # 64 or more for research runs
    point_source_mode: false

terrain:
  curvature: true                    # drop the DEM onto the lunar sphere (115 m at 20 km)

synthetic_dem:
  type: "parabolic_bowl"             # parabolic_bowl | conical | flat
  radius_m: 10500.0
  depth_m: 4200.0
  rim_height_m: 300.0
  grid_resolution_m: 200.0
  domain_padding_m: 3000.0
  seed: 42

# One-bounce terrain infrared exchange. Costly; off for previews.
view_factors:
  enabled: false
  num_rays: 128
  seed: 42
  reciprocity_tolerance: 0.05        # relative; Monte Carlo noise sits around 1-3 %
  max_neighbors: 256
  max_memory_mb: 1024.0

# Cold-trap classification against the hottest surface temperature of the run.
# Thresholds from Zhang & Paige (2009) and Hayne et al. (2015).
volatiles:
  enabled: true
  ice_thresholds_K:
    stable: 110.0
    marginal: 115.0

# Hapke (2012) directional-hemispherical albedo, mature highland regolith.
hapke:
  enabled: true
  single_scattering_albedo: 0.23
  b: 0.21
  c: 0.70
  B_SH0: 1.0
  h_s: 0.065
  lookup_size: 2049

# Bandfield et al. (2015) effective emissivity for sub-pixel roughness.
roughness:
  enabled: true
  rms_slope_deg: 20.0
  cavity_coefficient: 0.4

ephemeris:
  mode: "synthetic"                  # synthetic | skyfield | spice
  synthetic_subsolar_lat_deg: -1.5   # southern summer; physical range is about +-1.54
  kernel_name: "de421.bsp"           # skyfield mode
  data_dir: "data/ephemeris"
  kernel_files: []                   # spice mode
  frame: "MOON_ME"
  aberration_correction: "LT+S"

# Research mode refuses to run unless it has a provenance-verified DEM,
# SPICE geometry and enough spin-up.
research:
  enabled: false
  require_real_dem: true
  require_dem_provenance: true
  minimum_spinup_cycles: 3

time_range:
  start: "2025-01-01T00:00:00Z"
  end: "2025-01-02T00:00:00Z"        # used when --duration is not given
  output_interval_s: 3600.0
  spinup_cycles: 0
  spinup_convergence_tolerance_K: 0.1

resources:
  max_memory_mb: 1536.0              # the run refuses to start above this estimate

output:
  directory: "output"
  dpi: 150
  hero_dpi: 200
  max_snapshot_mb: 256.0             # disk budget for per-hour maps; frames are thinned to fit
